<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Nama Siswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        .card {
            width: 250px;
            height: 350px;
            background-color: #007788; /* Warna latar teal/biru tua */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .profile-circle {
            width: 100px;
            height: 100px;
            background-color: #fcc; /* Warna peach/jingga muda */
            border-radius: 50%;
            margin-bottom: 20px;
        }

        .student-name {
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
            margin: 5px 0;
        }

        .class-name {
            color: #ff9; /* Warna kuning pudar */
            font-size: 1em;
            margin: 5px 0;
        }

        .school-name {
            color: #fff;
            font-size: 0.9em;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-circle"></div>
        <p class="student-name">Fajri Nur Fadhil</p>
        <p class="class-name">X-RPP</p>
        <p class="school-name">SMK Setia Bhakti</p>
    </div>

</body>
</html>
