<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      height: 250px;
      width: 200px;
      border: solid 1px black;
      background-color: rgb(0, 84, 166); /* biru kayak di gambar */
      text-align: center;
      padding-top: 20px;
      color: white; /* biar teks keliatan */
      font-family: Arial, sans-serif;
    }
    .lingkaran {
      width: 120px;
      height: 120px;
      background-color: #f4a261; /* oranye */
      border-radius: 50%;
      margin: 0 auto 15px auto;
    }
    h4, h5 {
      margin: 5px 0;
      font-weight: normal;
    }
    h4:last-child {
      text-decoration: underline; /* baris terakhir digaris bawah kayak di gambar */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="lingkaran"></div>
    <h4>Fajri Nur Fadhil</h4>
    <h5>X-RPL</h5>
    <h4>SMK Setia Bhakti</h4>
  </div>
</body>
</html>
